name: Bytebase SQL review
on:
  pull_request:
    paths: ["migrations/*.sql"]
jobs:
  sql-review:
    # Reviews pull requests into the default branch, the branch that deploys.
    if: github.base_ref == github.event.repository.default_branch
    permissions:
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: bytebase/bytebase-action
    env:
      BYTEBASE_URL: "https://ff02-23-106-129-101.ngrok-free.app"
      BYTEBASE_WORKLOAD_IDENTITY: bb-gitops-ci@bbdev.workload.bytebase.com
    steps:
      - uses: actions/checkout@v4
      - name: SQL review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bytebase-action check \
            --url=$BYTEBASE_URL \
            --project=projects/bbdev \
            --targets=projects/bbdev/databaseGroups/employees \
            --file-pattern=migrations/*.sql
