name: Bytebase SQL review
on:
  pull_request:
    paths: ["migrations/*.sql"]
jobs:
  sql-review:
    # Reviews pull requests into the default branch, the branch that deploys.
    if: github.base_ref == github.event.repository.default_branch
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    container:
      image: bytebase/bytebase-action:cloud
    env:
      BYTEBASE_URL: "https://cloud.bytebase.com"
      BYTEBASE_WORKLOAD_IDENTITY: sb-employee@gitops-elg0.workload.bytebase.com
    steps:
      - uses: actions/checkout@v7
      - name: SQL review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bytebase-action check \
            --url=$BYTEBASE_URL \
            --project=projects/gitops-elg0 \
            --targets=instances/sb-employee-cvz1/databases/postgres \
            --file-pattern=migrations/*.sql
