name: Bytebase deploy
on:
  push:
    paths: ["migrations/*.sql"]
env:
  BYTEBASE_URL: "https://ff02-23-106-129-101.ngrok-free.app"
  BYTEBASE_WORKLOAD_IDENTITY: bb-gitops-ci@bbdev.workload.bytebase.com
  BYTEBASE_PROJECT: projects/bbdev
jobs:
  create-rollout:
    # Deploys what is merged into the default branch.
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    container:
      image: bytebase/bytebase-action
    outputs:
      bytebase-plan: ${{ steps.set-output.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - name: Create rollout
        run: |
          bytebase-action rollout \
            --url=$BYTEBASE_URL \
            --project=$BYTEBASE_PROJECT \
            --targets=projects/bbdev/databaseGroups/employees \
            --file-pattern=migrations/*.sql \
            --output=${{ runner.temp }}/bytebase-metadata.json
      - name: Set output
        id: set-output
        run: |
          PLAN=$(jq -r .plan ${{ runner.temp }}/bytebase-metadata.json)
          echo "plan=$PLAN" >> $GITHUB_OUTPUT
  deploy-to-test:
    needs: [create-rollout]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment: test
    container:
      image: bytebase/bytebase-action
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test
        run: |
          bytebase-action rollout \
            --url=$BYTEBASE_URL \
            --project=$BYTEBASE_PROJECT \
            --target-stage=environments/test \
            --plan=${{ needs.create-rollout.outputs.bytebase-plan }}
