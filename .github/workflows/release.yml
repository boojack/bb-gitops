name: Bytebase deploy
on:
  push:
    branches: ["main"]
    paths: ["migrations/*.sql"]
env:
  BYTEBASE_URL: "https://cloud.bytebase.com"
  BYTEBASE_WORKLOAD_IDENTITY: boojack-ci@gitops-elg0.workload.bytebase.com
  BYTEBASE_PROJECT: projects/gitops-elg0
jobs:
  create-rollout:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    container:
      image: bytebase/bytebase-action:cloud
    outputs:
      bytebase-plan: ${{ steps.set-output.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - name: Create rollout
        run: |
          bytebase-action rollout \
            --url="$BYTEBASE_URL" \
            --project="$BYTEBASE_PROJECT" \
            --targets=instances/sb-employee-cvz1/databases/postgres \
            --file-pattern="migrations/*.sql" \
            --output="${{ runner.temp }}/bytebase-metadata.json"
      - name: Set output
        id: set-output
        run: |
          PLAN=$(jq -er '.plan | select(type == "string" and length > 0)' "${{ runner.temp }}/bytebase-metadata.json")
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
  deploy-to-test:
    needs: [create-rollout]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: test
    container:
      image: bytebase/bytebase-action:cloud
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to test
        run: |
          bytebase-action rollout \
            --url="$BYTEBASE_URL" \
            --project="$BYTEBASE_PROJECT" \
            --target-stage=environments/test \
            --plan="${{ needs.create-rollout.outputs.bytebase-plan }}"
