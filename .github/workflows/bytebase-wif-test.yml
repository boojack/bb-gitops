name: Bytebase sign-in test
on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/bytebase-wif-test.yml
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  BYTEBASE_URL: https://cloud.bytebase.com
  BYTEBASE_WORKLOAD_IDENTITY: boojack-ci@gitops-elg0.workload.bytebase.com
jobs:
  sign-in:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        run: |
          OIDC_TOKEN=$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bytebase" | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$OIDC_TOKEN"
          echo "OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"
      - name: Exchange for a Bytebase access token
        run: |
          REQUEST=$(jq -n --arg token "$OIDC_TOKEN" --arg email "$BYTEBASE_WORKLOAD_IDENTITY" \
            '{token: $token, email: $email}')
          RESPONSE=$(curl -sS --fail-with-body "$BYTEBASE_URL/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "$REQUEST")
          ACCESS_TOKEN=$(jq -er '.accessToken | select(type == "string" and length > 0)' <<< "$RESPONSE")
          echo "::add-mask::$ACCESS_TOKEN"
          echo "Bytebase sign-in succeeded."
